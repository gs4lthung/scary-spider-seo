<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Multiple Meta Fixture</title>
  <title>A Second Title Element</title>
  <meta name="description" content="The first meta description on a page that declares two of them.">
  <meta name="description" content="The second meta description, which search engines may pick instead.">
  <meta http-equiv="Refresh" content="30; url=/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <h1>Multiple meta fixture</h1>
  <h2>Why this page exists</h2>
  <p>Exists to trigger the multiple titles, multiple meta descriptions and meta refresh checks.</p>
</body>
</html>
