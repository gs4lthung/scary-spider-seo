name: Deploy Site Monitor

on:
  push:
    branches: [main]
    paths:
      - "ops/site-monitor/**"
      - ".github/workflows/deploy-site-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-monitor-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: blog
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: blog/package-lock.json
      - run: npm ci
      - name: Generate Worker types
        run: >-
          npx wrangler types ../ops/site-monitor/worker-configuration.d.ts
          --config ../ops/site-monitor/wrangler.jsonc
          --include-runtime
      - name: Typecheck monitor Worker
        run: npx tsc --noEmit --project ../ops/site-monitor/tsconfig.json
      - name: Deploy monitor Worker
        run: >-
          npx wrangler deploy ../ops/site-monitor/src/index.ts
          --config ../ops/site-monitor/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
